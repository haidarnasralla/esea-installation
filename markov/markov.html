<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markov Chain Generator</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 2rem;
      background: #1a1a1a;
      color: #e0e0e0;
      min-height: 100vh;
    }

    header {
      max-width: 1400px;
      margin: 0 auto 1.5rem;
    }

    h1 {
      margin-bottom: 1rem;
      font-weight: 500;
    }

    .main-container {
      display: flex;
      gap: 2rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    .left-panel, .right-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .panel-label {
      font-size: 0.85rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }

    .dashboard {
      background: #222;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .controls {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    label {
      font-size: 0.85rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .mode-toggle {
      display: flex;
      background: #2a2a2a;
      border-radius: 6px;
      overflow: hidden;
    }

    .mode-toggle button {
      padding: 0.6rem 1.2rem;
      border: none;
      background: transparent;
      color: #888;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.15s;
    }

    .mode-toggle button.active {
      background: #3a3a3a;
      color: #fff;
    }

    .mode-toggle button:hover:not(.active) {
      color: #bbb;
    }

    input[type="range"] {
      width: 150px;
      height: 6px;
      -webkit-appearance: none;
      background: #2a2a2a;
      border-radius: 3px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      background: #fff;
      border-radius: 50%;
      cursor: pointer;
    }

    .slider-value {
      font-size: 1.5rem;
      font-weight: 600;
      min-width: 2rem;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    textarea {
      width: 100%;
      flex: 1;
      min-height: 400px;
      padding: 1rem;
      border: 1px solid #333;
      border-radius: 8px;
      background: #222;
      color: #e0e0e0;
      font-family: inherit;
      font-size: 0.95rem;
      resize: none;
    }

    textarea:focus {
      outline: none;
      border-color: #555;
    }

    textarea::placeholder {
      color: #555;
    }

    .output-container {
      background: #222;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 1.5rem;
      height: 400px;
      overflow-y: auto;
      display: flex;
      flex-direction: column-reverse;
    }

    .output-wrapper {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      min-height: 100%;
    }

    #output {
      font-family: 'Georgia', serif;
      font-size: 1.2rem;
      line-height: 1.7;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1.2em;
      background: #fff;
      margin-left: 2px;
      animation: blink 0.8s infinite;
      vertical-align: text-bottom;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    .buttons {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }

    button.action {
      padding: 0.7rem 1.5rem;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    button.primary {
      background: #fff;
      color: #1a1a1a;
    }

    button.primary:hover {
      background: #ddd;
    }

    button.secondary {
      background: #333;
      color: #e0e0e0;
    }

    button.secondary:hover {
      background: #444;
    }

    .status {
      font-size: 0.85rem;
      color: #666;
      margin-top: 1rem;
    }

    @media (max-width: 900px) {
      .main-container {
        flex-direction: column;
      }
      
      textarea, .output-container {
        min-height: 250px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Markov Chain Generator</h1>

    <div class="dashboard">
      <div class="controls">
        <div class="control-group">
          <label>Mode</label>
          <div class="mode-toggle">
            <button id="mode-word" class="active">Word</button>
            <button id="mode-char">Char</button>
          </div>
        </div>

        <div class="control-group">
          <label>Order</label>
          <div class="slider-row">
            <input type="range" id="order" min="1" max="10" value="3">
            <span class="slider-value" id="order-value">3</span>
          </div>
        </div>

        <div class="control-group">
          <label>Speed</label>
          <div class="slider-row">
            <input type="range" id="speed" min="1" max="100" value="50">
          </div>
        </div>

        <div class="buttons">
          <button class="action primary" id="start">Start</button>
          <button class="action secondary" id="stop">Stop</button>
          <button class="action secondary" id="clear">Clear</button>
        </div>
      </div>
    </div>
  </header>

  <div class="main-container">
    <div class="left-panel">
      <div class="panel-label">Corpus</div>
      <textarea id="corpus" placeholder="Paste your corpus here..."></textarea>
    </div>

    <div class="right-panel">
      <div class="panel-label">Output</div>
      <div class="output-container" id="output-container">
        <div class="output-wrapper">
          <div id="output"></div><span class="cursor" id="cursor"></span>
        </div>
      </div>

      <div class="status" id="status"></div>
    </div>
  </div>

  <script type="module">
    import MarkovGenerator from './markov-generator.js';

    // UI
    const generator = new MarkovGenerator();
    let streamGenerator = null;
    let isRunning = false;
    let timeoutId = null;

    const corpusEl = document.getElementById('corpus');
    const outputEl = document.getElementById('output');
    const cursorEl = document.getElementById('cursor');
    const statusEl = document.getElementById('status');
    const orderSlider = document.getElementById('order');
    const orderValue = document.getElementById('order-value');
    const speedSlider = document.getElementById('speed');
    const modeWordBtn = document.getElementById('mode-word');
    const modeCharBtn = document.getElementById('mode-char');
    const startBtn = document.getElementById('start');
    const stopBtn = document.getElementById('stop');
    const clearBtn = document.getElementById('clear');

    let mode = 'word';
    let order = 3;
    let lastMode = 'word';
    let lastOrder = 3;

    // Mode toggle
    modeWordBtn.addEventListener('click', () => {
      mode = 'word';
      modeWordBtn.classList.add('active');
      modeCharBtn.classList.remove('active');
      updateStatus();
    });

    modeCharBtn.addEventListener('click', () => {
      mode = 'char';
      modeCharBtn.classList.add('active');
      modeWordBtn.classList.remove('active');
      updateStatus();
    });

    // Order slider
    orderSlider.addEventListener('input', () => {
      order = parseInt(orderSlider.value);
      orderValue.textContent = order;
      updateStatus();
    });

    // Buttons
    startBtn.addEventListener('click', start);
    stopBtn.addEventListener('click', stop);
    clearBtn.addEventListener('click', () => {
      stop();
      outputEl.textContent = '';
    });

    function getDelay() {
      // Speed 1 = slow (500ms for word, 200ms for char)
      // Speed 100 = fast (10ms for word, 5ms for char)
      const speedVal = parseInt(speedSlider.value);
      const baseDelay = mode === 'word' ? 500 : 200;
      const minDelay = mode === 'word' ? 10 : 5;
      return minDelay + (baseDelay - minDelay) * (1 - speedVal / 100);
    }

    function start() {
      const corpus = corpusEl.value.trim();
      if (!corpus) {
        statusEl.textContent = 'Please paste a corpus first.';
        return;
      }

      generator.train(corpus);
      
      if (!isRunning) {
        outputEl.textContent = '';
      }
      
      isRunning = true;
      cursorEl.style.display = 'inline-block';
      streamGenerator = generator.generateStream(mode, order);
      lastMode = mode;
      lastOrder = order;
      tick();
    }

    function stop() {
      isRunning = false;
      cursorEl.style.display = 'none';
      if (timeoutId) {
        clearTimeout(timeoutId);
        timeoutId = null;
      }
    }

    function tick() {
      if (!isRunning) return;

      // Check if settings changed — if so, create new generator
      if (mode !== lastMode || order !== lastOrder) {
        streamGenerator = generator.generateStream(mode, order);
        lastMode = mode;
        lastOrder = order;
      }

      const result = streamGenerator.next();
      
      if (result.done) {
        streamGenerator = generator.generateStream(mode, order);
        timeoutId = setTimeout(tick, getDelay());
        return;
      }

      const { token, mode: tokenMode } = result.value;
      
      if (tokenMode === 'word' && outputEl.textContent.length > 0) {
        outputEl.textContent += ' ';
      }
      outputEl.textContent += token;

      // Scroll container to bottom
      const container = document.getElementById('output-container');
      container.scrollTop = container.scrollHeight;

      updateStatus();
      timeoutId = setTimeout(tick, getDelay());
    }

    function updateStatus() {
      const tokens = mode === 'word' ? generator.wordTokens.length : generator.charTokens.length;
      if (tokens > 0) {
        statusEl.textContent = `${mode} mode, order ${order}, ${tokens} tokens`;
      }
    }
  </script>
</body>
</html>
